# extend-ignore = ["D105", "D107", "F541", ]
# unfixable = ["B"]
# mccabe = { max-complexity = 14 }
# pydocstyle = { convention = "google" }

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

