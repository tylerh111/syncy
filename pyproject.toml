[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "syncy"
version = "0.0"
description = "Sync Workspaces"
authors = [
    {name = "Tyler Hughes", email = "tylerxh111+git@proton.me"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "sync",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []
# dynamic = [
#     "version",
# ]

[project.optional-dependencies]
toml = [
    "toml",
]
dotenv = [
    "dotenv",
]

[project.scripts]
syncy = "syncy:entrypoint"

[project.urls]
source        = "https://github.com/tylerh111/syncy"
issues        = "https://github.com/tylerh111/syncy/issues"
changes       = "https://github.com/tylerh111/syncy/blob/main/CHANGES.md"
documentation = "https://syncy.readthedocs.io"

[tool.bumpver]
current_version = "0.0"
version_pattern = "MAJOR.MINOR[.PATCH][-TAG]"
commit_message = "release version {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"LICENSE.md" = [
    'Copyright (c) YYYY',
]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/pydantic_pint/__init__.py" = [
    '__version__ = "{version}"',
]

